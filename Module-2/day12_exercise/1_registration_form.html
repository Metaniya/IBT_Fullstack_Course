<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Telecom - Registration</title>
</head>
<body>
    <h1>Ethio Telecom Service Registration</h1>

    <!--
        Using method="post" because this form collects personal data
        (name, email, phone). GET would put all of this in the URL,
        which is not safe or appropriate for personal information.
    -->
    <form action="/register" method="post">

        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required>

        <br><br>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <br><br>

        <label for="tel">Phone Number</label>
        <input id="tel" name="tel" type="tel"
               pattern="\+251[0-9]{9}"
               placeholder="+251912345678"
               title="Phone must start with +251 followed by 9 digits"
               required>

        <br><br>

        <label for="branch">Branch</label>
        <select id="branch" name="branch" required>
            <option value="">-- Select a branch --</option>
            <option value="bole">Bole</option>
            <option value="kazanchis">Kazanchis</option>
            <option value="piassa">Piassa</option>
        </select>

        <br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
