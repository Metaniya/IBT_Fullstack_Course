<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Habesha Eatery, Bole</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa, or check our opening hours.">
</head>
<body>

    <header>
        <h1>Contact Habesha Eatery</h1>
    </header>

    <nav>
        <a href="index.html">Reservations</a> ·
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section id="contact-form">
            <h2>Send Us a Message</h2>

            <!--
                Using method="post" since the form submits a name,
                email, and message, which should not be exposed
                in the URL.
            -->
            <form action="/contact" method="post">

                <label for="name">Name</label>
                <input id="name" name="name" type="text" required>

                <br><br>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>

                <br><br>

                <label for="message">Message</label>
                <br>
                <textarea id="message" name="message" rows="5" required></textarea>

                <br><br>

                <button type="submit">Send</button>
            </form>
        </section>

        <section id="hours">
            <h2>Opening Hours</h2>
            <table>
                <caption>Habesha Eatery weekly opening hours</caption>
                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Hours</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Monday - Friday</td>
                        <td>8:00 AM - 9:00 PM</td>
                    </tr>
                    <tr>
                        <td>Saturday</td>
                        <td>9:00 AM - 10:00 PM</td>
                    </tr>
                    <tr>
                        <td>Sunday</td>
                        <td>10:00 AM - 8:00 PM</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Bole, Addis Ababa</p>
    </footer>

</body>
</html>
