<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 4 - Airlines Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        caption {
            font-weight: bold;
            margin-bottom: 10px;
        }

        th {
            background-color: #7b3f00;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
        }

        /* Zebra stripe every even row */
        tr:nth-child(even) {
            background-color: #f0e6d6;
        }
    </style>
</head>
<body>
    <table>
        <caption>Ethiopian Airlines Flight Schedule</caption>
        <thead>
            <tr>
                <th scope="col">Flight</th>
                <th scope="col">From</th>
                <th scope="col">To</th>
                <th scope="col">Departs</th>
                <th scope="col">Price ETB</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>ET201</td>
                <td>Addis Ababa</td>
                <td>Dire Dawa</td>
                <td>07:30</td>
                <td>3,200</td>
            </tr>
            <tr>
                <td>ET305</td>
                <td>Addis Ababa</td>
                <td>Bahir Dar</td>
                <td>09:15</td>
                <td>2,800</td>
            </tr>
            <tr>
                <td>ET412</td>
                <td>Addis Ababa</td>
                <td>Gondar</td>
                <td>11:00</td>
                <td>2,950</td>
            </tr>
            <tr>
                <td>ET520</td>
                <td>Addis Ababa</td>
                <td>Mekelle</td>
                <td>13:45</td>
                <td>3,100</td>
            </tr>
            <tr>
                <td>ET618</td>
                <td>Addis Ababa</td>
                <td>Hawassa</td>
                <td>16:20</td>
                <td>2,500</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
