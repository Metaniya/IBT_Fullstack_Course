<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2 - Create List Items</title>
</head>
<body>
    <h1>Ethiopian Cities</h1>
    <ul id="cityList"></ul>

    <script>
        const cities = ["Addis Ababa", "Bahir Dar", "Gondar"];
        const list = document.querySelector("#cityList");

        cities.forEach(city => {
            const li = document.createElement("li");
            li.textContent = city;
            list.append(li);
        });
    </script>
</body>
</html>
