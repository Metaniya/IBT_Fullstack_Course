<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Market List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Addis Market List</h1>

    <form id="add-form">
        <input id="name" type="text" placeholder="e.g. Teff" required>
        <input id="price" type="number" placeholder="Price ETB" min="0" step="0.01" required>
        <button type="submit">Add Item</button>
    </form>

    <p id="total">Total: 0 ETB</p>

    <ul id="list"></ul>

    <script src="app.js"></script>
</body>
</html>
